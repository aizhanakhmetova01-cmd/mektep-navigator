<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F6FE5">

<style>
/* Layout: full-screen map, floating search on top, floor picker on the right, bottom sheet for details and route */
:root{
  --bg:#EEF3F5; --surface:#FFFFFF; --surface-2:#F4F8FA; --fg:#10232E; --muted:#5B6F7A; --line:#D5E0E6;
  --accent:#0E6E95; --accent-ink:#FFFFFF; --accent-soft:#DCEFF7;
  --gold:#F2B705; --gold-soft:#FFF1C2; --exit:#1E9A55;
  --map-ground:#E4ECF0; --map-building:#F7FAFB; --map-wall:#55707E; --map-corr:#E9F3F8; --map-room:#FFFFFF; --map-room-line:#9DB2BD; --map-misc:#E3E9EC; --map-label:#2A3D47; --map-big:#EAF4EC;
  --shadow:0 6px 24px rgba(16,35,46,.14);
  --f1:#D63B3B; --f1-bg:#FCEBE9; --f1-corr:#F6D2CD; --f2:#E07B0C; --f2-bg:#FDF1E2; --f2-corr:#F8DDB9; --f3:#2E9B57; --f3-bg:#E8F6ED; --f3-corr:#C9EAD5; --here:#1F6FE5;
  --f-display:"Unbounded","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1419; --surface:#14222A; --surface-2:#1A2B34; --fg:#E6EEF2; --muted:#94A9B4; --line:#2A3E49;
  --accent:#4FB6E0; --accent-ink:#06202C; --accent-soft:#163A4B;
  --gold:#FFC93A; --gold-soft:#4A3A0B; --exit:#3CCB7F;
  --map-ground:#0E1A20; --map-building:#16252D; --map-wall:#7E98A5; --map-corr:#1B313C; --map-room:#1F323C; --map-room-line:#4A6370; --map-misc:#192A32; --map-label:#D7E3E9; --map-big:#1B3328;
  --f1:#FF6B63; --f1-bg:#2B1817; --f1-corr:#43211F; --f2:#FFA33D; --f2-bg:#2B2013; --f2-corr:#47321A; --f3:#4FD283; --f3-bg:#14271C; --f3-corr:#1C3D29; --here:#5B9BFF;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1419; --surface:#14222A; --surface-2:#1A2B34; --fg:#E6EEF2; --muted:#94A9B4; --line:#2A3E49;
  --accent:#4FB6E0; --accent-ink:#06202C; --accent-soft:#163A4B;
  --gold:#FFC93A; --gold-soft:#4A3A0B; --exit:#3CCB7F;
  --map-ground:#0E1A20; --map-building:#16252D; --map-wall:#7E98A5; --map-corr:#1B313C; --map-room:#1F323C; --map-room-line:#4A6370; --map-misc:#192A32; --map-label:#D7E3E9; --map-big:#1B3328;
  --f1:#FF6B63; --f1-bg:#2B1817; --f1-corr:#43211F; --f2:#FFA33D; --f2-bg:#2B2013; --f2-corr:#47321A; --f3:#4FD283; --f3-bg:#14271C; --f3-corr:#1C3D29; --here:#5B9BFF;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden;--fl:var(--f1);--fl-bg:var(--f1-bg);--fl-corr:var(--f1-corr)}
.app[data-floor="2"]{--fl:var(--f2);--fl-bg:var(--f2-bg);--fl-corr:var(--f2-corr)}
.app[data-floor="3"]{--fl:var(--f3);--fl-bg:var(--f3-bg);--fl-corr:var(--f3-corr)}

/* map */
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:var(--map-ground);display:block;user-select:none;-webkit-user-select:none}
#map .bld{fill:var(--fl-bg);stroke:var(--fl);stroke-width:3;stroke-linejoin:round}
#map .corr{fill:var(--fl-corr)}
#map .room{fill:var(--map-room);stroke:var(--map-room-line);stroke-width:1.2;cursor:pointer;transition:fill .2s}
#map .room.big{fill:var(--map-big)}
#map .misc{fill:var(--map-misc);stroke:var(--map-room-line);stroke-width:.8}
#map .room.sel{fill:var(--gold-soft);stroke:var(--gold);stroke-width:3}
#map .room.start{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
#map .lbl{font-family:var(--f-body);font-weight:700;fill:var(--map-label);text-anchor:middle;dominant-baseline:central;pointer-events:none}
#map .lbl.name{font-weight:600}
#map .korpus{font-family:var(--f-display);font-weight:700;fill:var(--fl);opacity:.3;text-anchor:middle;pointer-events:none}
#map .stair rect{fill:var(--map-building);stroke:var(--map-wall);stroke-width:1}
#map .stair line{stroke:var(--map-wall);stroke-width:1}
#map .stair.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
#map .exit rect{fill:var(--exit)}
#map .exit text{fill:#fff;font-size:8px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--f-body);letter-spacing:.04em}
#map .route-casing{fill:none;stroke:var(--surface);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
#map .route{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 12;animation:march 1s linear infinite}
#map .route-solid{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.35}
@keyframes march{to{stroke-dashoffset:-13}}
#map .pin-pulse{fill:var(--gold);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.6}to{transform:scale(1.6);opacity:0}}
#map .pin{fill:var(--gold);stroke:var(--surface);stroke-width:3}
#map .startdot{fill:var(--here);stroke:var(--surface);stroke-width:3}
#map .here-pulse{fill:var(--here);transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
#map .here-lbl{font-family:var(--f-body);font-weight:700;font-size:10px;fill:var(--here);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.locbtn{color:var(--here)!important}
@media (prefers-reduced-motion:reduce){#map .here-pulse{animation:none}}
@media (prefers-reduced-motion:reduce){#map .route,#map .pin-pulse{animation:none}}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:14px;background:linear-gradient(var(--bg) 62%,transparent);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand h1 .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.lang{display:flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 6px 0 14px;height:50px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);height:100%;outline:none}
.search input::placeholder{color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2)}

/* floor picker */
.floors{position:absolute;z-index:15;right:max(12px,env(safe-area-inset-right,0px));top:140px;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.floors .cap{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:7px 4px 3px}
.floors button{width:52px;height:46px;font-family:var(--f-display);font-weight:700;font-size:17px;position:relative;color:var(--muted)}
.floors button[data-floor="1"]{--c:var(--f1)}.floors button[data-floor="2"]{--c:var(--f2)}.floors button[data-floor="3"]{--c:var(--f3)}
.floors button{color:var(--c)}
.floors button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.floors button[aria-pressed="true"]{background:var(--c);color:#fff}
.flbadge{display:inline-block;padding:1px 8px;border-radius:999px;color:#fff;font-weight:600;font-size:12px;margin-right:6px}
.flbadge.f1{background:var(--f1)}.flbadge.f2{background:var(--f2)}.flbadge.f3{background:var(--f3)}
.floors button.onroute::after{content:"";position:absolute;right:7px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.zoom{position:absolute;z-index:15;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:52px;height:44px;display:grid;place-items:center;color:var(--fg)}
.zoom button+button{border-top:1px solid var(--line)}

/* bottom sheet */
.sheet{position:absolute;z-index:25;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(16,35,46,.16);
  padding-top:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-height:55%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip .fl{font-size:11px;font-weight:700;color:var(--muted)}
.btnrow{display:flex;gap:8px}
.btn{flex:1;height:48px;border-radius:13px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{flex:none;height:40px;padding:0 14px;font-size:14px}
.title-row{display:flex;align-items:flex-start;gap:12px}
.badge{flex:none;min-width:56px;height:56px;padding:0 8px;border-radius:14px;background:var(--gold-soft);color:var(--fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;border:2px solid var(--gold)}
.title-row h2{margin:0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin-top:3px}
.close{margin-left:auto}
.from{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.from .dot{width:12px;height:12px;border-radius:50%;background:var(--here);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.from b{font-weight:600}
.from button{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:9px 0;position:relative;cursor:pointer;border-radius:10px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:16px;top:42px;bottom:-6px;width:2px;background:var(--line)}
.steps .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.steps li.cur .ic{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps li.done .ic{border-color:var(--accent);color:var(--accent)}
.steps li.end .ic{background:var(--gold);border-color:var(--gold);color:#3A2A00}
.steps .t{font-weight:600;line-height:1.3;padding-top:6px}
.steps .s{color:var(--muted);font-size:13px;margin-top:2px}
.stepcard{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--accent-soft)}
.stepcard .ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px}
.stepcard.end{background:var(--gold-soft)}.stepcard.end .ic{background:var(--gold);color:#3A2A00}
.stepcard .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stepcard .t{font-weight:700;font-size:16px;line-height:1.3;margin-top:2px}
.stepcard .s{color:var(--muted);font-size:13px;margin-top:2px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{align-self:flex-start;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}
.qrbanner{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--accent-soft)}
.qrbanner .s{font-size:13px;color:var(--muted);margin-top:2px}
.qrtag{flex:none;width:40px;height:40px;border-radius:10px;background:var(--here);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em}
.qrcard{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.qrcard .qrimg{width:180px;max-width:100%;flex:none}.qrcard .qrimg svg{display:block;width:100%;height:auto;border-radius:6px}
.qrcard .n{font-weight:700;font-size:17px}.qrcard .m{color:var(--muted);font-size:13px;margin-top:3px}.mono{font-family:ui-monospace,Menlo,monospace}
#qrlist{display:flex;flex-direction:column;gap:12px}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* search results overlay */
.results{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.results .top-inner{display:flex;flex-direction:column;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.results .hint{font-size:13px;color:var(--muted);padding:0 4px}
.rlist{flex:1;overflow-y:auto;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.group{margin-top:12px}
.group h3{margin:0 4px 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cell{height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.cell small{font-size:10px;font-weight:500;color:var(--muted)}
.cell:hover{border-color:var(--accent)}
.wide{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.row .n{font-weight:600}
.row .m{font-size:13px;color:var(--muted)}
.row .ri{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.pickmode{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}

/* plan viewer */
.planview{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.planview header{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.planview header h2{margin:0;font-size:16px;font-weight:700;flex:1}
.planview .scroll{flex:1;overflow:auto;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.planview img{width:100%;max-width:100%;border-radius:10px;background:#fff;display:block}
.toast{position:absolute;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
</style>

  <div class="top">

    <button id="zin" aria-label="+"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="−"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="zfit" aria-label="fit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div class="sheet" id="sheet"></div>

  <div class="results" id="results" hidden>
    <div class="top-inner">
      <div class="search">
        <button class="iconbtn" id="closeResults" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <input id="q2" type="search" inputmode="search" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="pickmode" id="pickHint" hidden></div>
    </div>
    <div class="rlist" id="rlist"></div>
  </div>

  <div class="planview" id="planview" hidden>
    <header>
      <button class="iconbtn" id="closePlan" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="planTitle"></h2>
    </header>
    <div class="scroll"><img id="planImg" alt=""><div id="qrlist" hidden></div></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

function findRoute(fromRef,toRef){

    if($("bAllSteps"))$("bAllSteps").onclick=()=>{st.showAll=!st.showAll;renderSheet();};
    if($("bCopy"))$("bCopy").onclick=copyLink;
    sh.querySelectorAll(".steps li").forEach(li=>li.onclick=()=>goStep(+li.dataset.step));
  }
  sh.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>selectRoom(b.dataset.pick,true));
}
function goStep(i){if(!st.route)return;const steps=stepsFor(st.route);i=Math.max(0,Math.min(steps.length-1,i));st.step=i;
  const ns=steps[i].seg;const changed=ns!==st.seg||st.route.segs[ns].f!==st.floor;st.seg=ns;st.floor=st.route.segs[ns].f;
  drawFloor();renderFloors();renderSheet();if(changed)requestAnimationFrame(()=>fitCurrent());}
function buildRoute(){
  if(!st.sel)return;
  if(st.sel===st.from){toast(t().sameRoom);return;}
  st.route=findRoute(st.from,st.sel);st.seg=0;st.step=0;
  if(st.route){st.floor=st.route.segs[0].f;}
  drawFloor();renderFloors();renderSheet();requestAnimationFrame(()=>fitCurrent());
}
function selectRoom(id,autoRoute){
  st.sel=id;st.route=null;st.floor=ROOMS[id].f;updateHash();
  if(autoRoute&&st.from!==id){buildRoute();return;}
  drawFloor();renderFloors();renderSheet();requestAnimationFrame(()=>fitCurrent());
}
function onRoomTap(id){
  if(st.sel===id&&!st.route){buildRoute();return;}
  st.sel=id;st.route=null;updateHash();drawFloor();renderSheet();renderFloors();requestAnimationFrame(()=>fitCurrent());
}
function clearSel(){st.sel=null;st.route=null;updateHash();drawFloor();renderFloors();renderSheet();requestAnimationFrame(()=>fitBox(floorBBox(st.floor)));}

/* search */
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
function matches(r,q){
  if(!q)return true;q=norm(q);
  const hay=norm([r.id.startsWith("inf")&&r.name?"":r.id,r.label||"",r.name?NAMES[r.name].ru+" "+NAMES[r.name].kk:"",ALIASES[r.name]||"",r.desc?DESC[r.desc].ru+" "+DESC[r.desc].kk:"",r.near||"","каб кабинет"].join(" "));
  return q.split(" ").every(w=>hay.includes(w)||(r.label||r.id).replace(/[^\dа-яa-z]/gi,"").toLowerCase().startsWith(w.replace(/[^\dа-яa-z]/gi,"")));
}
function renderResults(){
  const L=t(),q=$("q2").value;const list=$("rlist");let html="";
  const named=Object.values(ROOMS).filter(r=>r.name&&r.id!=="pvs"&&matches(r,q));
  const pts=st.pickingStart?Object.keys(POINTS).filter(id=>{const P=POINTS[id];return !q||norm(P.ru+" "+P.kk+" вход кіреберіс qr").includes(norm(q));}):[];const entranceMatch=pts.length>0;
  if(entranceMatch||named.length){
    html+=`<div class="group"><h3>${esc(L.special)}</h3><div class="wide">`;
    html+=pts.map(id=>`<button class="row" data-r="qr-${id}"><span class="ri">QR</span><span><div class="n">${esc(POINTS[id][lang])}</div><div class="m">${esc(L.floor(POINTS[id].f))} · ${esc(L.qrPoint)}</div></span></button>`).join("");
    html+=named.map(r=>`<button class="row" data-r="${r.id}"><span class="ri">${r.f}</span><span><div class="n">${esc(roomTitle(r))}</div><div class="m">${esc(L.floor(r.f))} · ${esc(korpusLabel(r.k))}${roomDesc(r)?" · "+esc(roomDesc(r)):""}</div></span></button>`).join("");
    html+=`</div></div>`;
  }
  let any=named.length||entranceMatch;
  for(const f of [1,2,3]){
    const rs=FLOORS[f].rooms.filter(r=>(!r.name||r.id==="pvs")&&matches(r,q)).sort((a,b)=>(a.label||a.id).localeCompare(b.label||b.id,"ru",{numeric:true}));
    if(!rs.length)continue;any=true;
    html+=`<div class="group"><h3><span class="flbadge f${f}">${f}</span>${esc(L.floor(f))}</h3><div class="grid">${rs.map(r=>`<button class="cell" data-r="${r.id}">${esc(r.label||(r.id==="pvs"?"ПВС":r.id))}<small>${esc(r.desc?DESC[r.desc][lang].split(" ")[0]:korpusLabel(r.k))}</small></button>`).join("")}</div></div>`;
  }
  if(!any)html=`<div class="empty">${esc(L.noRes)}</div>`;
  list.innerHTML=html;
  list.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>pickResult(b.dataset.r));
}
function openResults(pickingStart){
  st.pickingStart=pickingStart;$("results").hidden=false;$("pickHint").hidden=!pickingStart;$("pickHint").textContent=pickingStart==="loc"?t().locHint:t().pickStart;
  $("q2").value=pickingStart?"":$("q").value;renderResults();setTimeout(()=>$("q2").focus(),30);
}
function closeResults(){$("results").hidden=true;$("q").value="";$("q").blur();}
function pickResult(id){
  closeResults();
  if(st.pickingStart){st.from=id;st.pickingStart=false;if(st.sel&&st.sel!==id)buildRoute();else{if(st.sel===id){st.sel=null;st.route=null;}st.floor=refPos(id).f;updateHash();drawFloor();renderSheet();renderFloors();toast(t().hereSet(placeName(id)));requestAnimationFrame(()=>flyHere());}return;}
  selectRoom(id,true);
}
$("q").addEventListener("focus",()=>openResults(false));
$("q2").addEventListener("input",renderResults);
$("q2").addEventListener("keydown",e=>{if(e.key==="Enter"){const b=$("rlist").querySelector("[data-r]");if(b)pickResult(b.dataset.r);}if(e.key==="Escape")closeResults();});
$("closeResults").onclick=closeResults;
$("openList").onclick=e=>{e.stopPropagation();openResults(false);};

function flyHere(){const r=isPt(st.from)?null:ROOMS[st.from];
  if(r){const pad=110;fitBox({x:r.x-pad,y:r.y-pad,w:r.w+2*pad,h:r.h+2*pad});}
  else{const p=refPos(st.from);fitBox({x:p.x-120,y:p.y-160,w:240,h:220});}}
$("zloc").onclick=()=>{if(st.from!=="qr-main"||st.route){const f=refPos(st.from).f;if(f!==st.floor){st.floor=f;drawFloor();renderFloors();}}
  openResults("loc");};
/* plan viewer */
function openQR(){const L=t();$("planTitle").textContent=L.qrCodes;$("planImg").hidden=true;
  $("qrlist").hidden=false;$("qrlist").innerHTML=Object.keys(POINTS).map(id=>`<div class="qrcard"><div class="qrimg">${QRSVG[id]||""}</div><div><div class="n">${esc(POINTS[id][lang])}</div><div class="m">${esc(L.floor(POINTS[id].f))}</div><div class="m mono">#qr-${id}</div></div></div>`).join("")+`<p class="note">${esc(L.qrAbout)}</p>`;
  $("planview").hidden=false;}
function openPlan(){$("planImg").hidden=false;$("qrlist").hidden=true;const f=st.floor;$("planTitle").textContent=t().planOf(f);$("planImg").src=PLAN_IMG[f];$("planImg").alt=t().planOf(f);$("planview").hidden=false;}
$("closePlan").onclick=()=>{$("planview").hidden=true;};

/* toast, link */
let toastT;function toast(msg){const e=$("toast");e.textContent=msg;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200);}
function updateHash(){try{const h=st.sel?"#r-"+st.sel+(st.from!=="qr-main"?"-from-"+st.from:""):"";if(location.hash!==h)history.replaceState(null,"",h||location.pathname+location.search);}catch(e){}}
function copyLink(){const url=location.href;try{navigator.clipboard.writeText(url).then(()=>toast(t().copied),()=>toast(t().copyFail));}catch(e){toast(t().copyFail);}}
function readHash(){const qm=/^#qr-([a-z0-9]+)$/i.exec(location.hash);
  if(qm&&POINTS[qm[1]]){const ref="qr-"+qm[1];st.from=ref;st.qrScanned=ref;st.sel=null;st.route=null;st.floor=POINTS[qm[1]].f;drawFloor();renderFloors();renderSheet();toast(t().hereSet(placeName(ref)));requestAnimationFrame(()=>flyHere());return true;}
const h=/^#here-([a-z0-9]+)$/i.exec(location.hash);
  if(h&&ROOMS[h[1]]){st.from=h[1];st.sel=null;st.route=null;st.floor=ROOMS[h[1]].f;drawFloor();renderFloors();renderSheet();toast(t().hereSet(placeName(h[1])));requestAnimationFrame(()=>flyHere());return true;}
const m=/^#r-([a-z0-9]+)(?:-from-(qr-[a-z0-9]+|[a-z0-9]+))?$/i.exec(location.hash);if(m&&ROOMS[m[1]]){if(m[2]&&(ROOMS[m[2]]||(isPt(m[2])&&ptOf(m[2]))))st.from=m[2];selectRoom(m[1],true);return true;}return false;}
window.addEventListener("hashchange",()=>{readHash();});

/* language */
function applyLang(){
  document.documentElement.lang=lang==="kk"?"kk":"ru";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t()[e.dataset.t]);
  $("q").placeholder=t().search;$("q2").placeholder=t().search;
  $("lang-ru").setAttribute("aria-pressed",lang==="ru");$("lang-kk").setAttribute("aria-pressed",lang==="kk");
  document.title=t().appName;$("zloc").setAttribute("aria-label",t().whereAmI);
  drawFloor();renderFloors();renderSheet();if(!$("results").hidden)renderResults();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("nav-lang",lang);}catch(e){}applyLang();});

window.addEventListener("resize",()=>{renderFloors();fitCurrent(false);});
applyLang();
if(!readHash()){requestAnimationFrame(()=>fitCurrent(false));}
</script>

</body></html>
